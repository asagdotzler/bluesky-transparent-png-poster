name: Firefox extension checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regression:
    name: Node regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete tracked suite
        run: node tests/run.mjs

  amo-lint:
    name: Mozilla web-ext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage runtime-only AMO source
        run: |
          mkdir -p /tmp/transparent-png-amo/_locales/en /tmp/transparent-png-amo/icons
          cp LICENSE manifest.json *.js *.css *.html /tmp/transparent-png-amo/
          cp _locales/en/messages.json /tmp/transparent-png-amo/_locales/en/
          cp icons/png.svg icons/png-toolbar.svg /tmp/transparent-png-amo/icons/
      - name: Mozilla official linter
        run: npx --yes web-ext lint --source-dir /tmp/transparent-png-amo
